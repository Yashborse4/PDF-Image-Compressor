name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable
        run: |
          python -m PyInstaller `
            --name "DocuTools" `
            --windowed `
            --onedir `
            --clean `
            --noconfirm `
            --icon "docutools/assets/icon.ico" `
            --add-data "docutools/assets;docutools/assets" `
            --add-data "docutools/ui/styles.py;docutools/ui" `
            run.py

      - name: Package Release ZIP
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path "dist/DocuTools/*" -DestinationPath "dist/DocuTools-$version-windows-x64.zip"

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc "installer\docutools.iss"
          } else {
            Write-Warning "ISCC not found on runner, skipping setup exe."
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "DocuTools Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/installer/*.exe
